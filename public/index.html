<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SY Alizée</title>
<style>
:root{--ink:#14275f;--ink2:#4d5b78;--panel:rgba(247,249,250,.9);--line:rgba(20,39,95,.16);--focus:#1d63d8;--panelSolid:rgba(247,249,250,.97);color-scheme:light}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#c5dcea;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.title{position:fixed;left:22px;top:16px;pointer-events:none}
.title h1{margin:0;font:italic 400 clamp(34px,5vw,54px)/1 Georgia,"Times New Roman",serif}
.title p{margin:6px 0 0 2px;font-size:14px;font-weight:500;color:var(--ink2)}
.bar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100vw - 16px)}
.group{display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 26px rgba(12,28,52,.16);max-width:100%;overflow-x:auto;scrollbar-width:none}
button{appearance:none;border:0;background:transparent;color:var(--ink2);font:500 14px/1 inherit;font-family:inherit;padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
button:hover{color:var(--ink)}button[aria-pressed="true"]{background:var(--ink);color:#fff}
button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.arch{position:fixed;right:16px;top:16px;width:318px;max-width:calc(100vw - 32px);max-height:calc(100dvh - 150px);overflow:auto;padding:0;border-radius:16px;background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 26px rgba(12,28,52,.16);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.arch summary{white-space:nowrap;position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:13px 16px;background:var(--panelSolid);cursor:pointer;font:italic 400 23px/1.1 Georgia,"Times New Roman",serif;list-style:none}
.arch summary::-webkit-details-marker{display:none}.arch summary:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;border-radius:16px}
.arch summary span{font:500 13px/1.2 system-ui,sans-serif;color:var(--ink2);text-align:right}
.arch-body{padding:0 16px 14px}
.pick{border:0;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:3px}.pick legend{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.pick label{display:flex;align-items:center;gap:7px;padding:8px;border-radius:9px;font-size:13px;font-weight:500;color:var(--ink2);cursor:pointer}
.pick label:hover{background:rgba(20,39,95,.07);color:var(--ink)}.pick input{accent-color:var(--ink);margin:0}
.pick label:has(input:checked){background:var(--ink);color:#fff}.pick label:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:1px}
.seg{border:0;margin:10px 0 0;padding:0}.seg legend{padding:0 2px 4px;font-size:12px;font-weight:600;color:var(--ink2)}
.seg>div{display:flex;gap:2px;padding:3px;border-radius:10px;background:rgba(20,39,95,.08)}
.seg label{flex:1;position:relative;text-align:center;padding:7px 4px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink2);cursor:pointer}
.seg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}.seg label:has(input:checked){background:var(--ink);color:#fff}
.seg label:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:1px}
#archOptions[hidden],.seg[hidden]{display:none}
.note{margin:10px 2px 4px;font-size:13px;line-height:1.45;color:var(--ink2)}
.stats h2{margin:13px 2px 3px;font-size:12px;font-weight:600;color:var(--ink2)}
.stats dl{margin:0}.stats dl div{display:flex;justify-content:space-between;gap:10px;padding:4px 2px;border-top:1px solid var(--line);font-size:13.5px}
.stats dt{color:var(--ink2)}.stats dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats dd.warn{color:#a4331f}.stats dd.warn::before{content:"Tight  ";font-weight:500}
.stats dd.hit{color:#fff;background:#a4331f;padding:0 6px;border-radius:5px}
.angle-svg{display:block;width:100%;height:auto;margin:2px 0 6px;border-radius:9px;background:rgba(20,39,95,.05)}
.angle-svg line{stroke-linecap:round}.d-hull{stroke:var(--ink2);stroke-width:4}.d-frame{stroke:var(--ink);stroke-width:5}.d-pipe{stroke:var(--ink);stroke-width:4}
.d-stub{stroke:var(--ink);stroke-width:3}.d-ref{stroke:var(--ink2);stroke-width:1.2;stroke-dasharray:4 3}.d-arc{fill:none;stroke:#b4471f;stroke-width:1.8}
.d-lead{stroke:#b4471f;stroke-width:1}
.d-val{fill:#a4331f;font-size:13px;font-weight:700}.d-tag{fill:var(--ink2);font-size:11px}
.fine{margin:11px 2px 0;font-size:12px;line-height:1.4;color:var(--ink2)}
@media (max-width:760px){.arch{top:auto;right:8px;left:8px;width:auto;max-width:none;bottom:calc(112px + env(safe-area-inset-bottom,0px));max-height:calc(100dvh - 210px)}}
@media (max-width:620px){button{padding:9px 10px;font-size:13px}.title{left:16px}}
</style>
</head>
<body>
<canvas id="view" tabindex="0" aria-label="3D model of the sailing yacht SY Alizée. Drag to rotate, scroll to zoom."></canvas>
<div class="title"><h1>SY Alizée</h1><p>Malö 36</p></div>
<details class="arch" id="archPanel" open>
  <summary>Solar arch <span id="archCurrent"></span></summary>
  <div class="arch-body">
    <fieldset class="pick" id="archPick"><legend>Arch design</legend></fieldset>
    <div id="archOptions">
      <fieldset class="seg"><legend>Panels</legend><div id="archPanelPick"></div></fieldset>
      <fieldset class="seg"><legend>Panel orientation</legend><div id="archOrientPick"></div></fieldset>
      <fieldset class="seg" id="archRearWrap"><legend>Rear pipe top angle</legend><div id="archRearPick"></div></fieldset>
      <fieldset class="seg"><legend>Pipe diameter</legend><div id="archPipePick"></div></fieldset>
    </div>
    <fieldset class="seg"><legend>Panels along lifelines</legend><div id="archSidePick"></div></fieldset>
    <p class="note" id="archNote"></p>
    <div class="stats" id="archStats" aria-live="polite"></div>
    <p class="fine">Measured on the 3D model. The stern is estimated from photos, so check with a tape measure before building.</p>
  </div>
</details>
<div class="bar">
  <div class="group" role="group" aria-label="Layers">
    <button data-layer="water" aria-pressed="true">Water</button>
    <button data-layer="canvas" aria-pressed="true">Canvas</button>
    <button data-layer="rig" aria-pressed="true">Rig</button>
    <button data-layer="sail" aria-pressed="false">Mainsail</button>
    <button data-layer="rails" aria-pressed="true">Rails</button>
    <button data-layer="drawing" aria-pressed="false">Brochure drawing</button>
  </div>
  <div class="group" role="group" aria-label="View">
    <button data-view="hero">Overview</button>
    <button data-view="deck">Deck</button>
    <button data-view="stern">Quarter</button>
    <button data-view="side">Side</button>
    <button data-view="full">Full rig</button>
    <button data-view="top">Top</button>
    <button data-view="arch">Arch</button>
    <button data-view="aft">Stern</button>
    <button data-view="bow">Bow</button>
  </div>
</div>

/* Monotone cubic through a table, so hull curves stay fair and never overshoot. */

  const d = xs.slice(0, -1).map((x, i) => (ys[i + 1] - ys[i])/(xs[i + 1] - x));
  const m = ys.map((_, i) => i === 0 ? d[0] : i === n - 1 ? d[n - 2] : d[i - 1]*d[i] <= 0 ? 0 : (d[i - 1] + d[i])/2);

    const a = m[i]/d[i], b = m[i + 1]/d[i], s = a*a + b*b;

    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];

    return (2*t3 - 3*t2 + 1)*ys[i] + (t3 - 2*t2 + t)*h*m[i] + (3*t2 - 2*t3)*ys[i + 1] + (t3 - t2)*h*m[i + 1];

}

/* Hull surface, painted livery, moulding, keel, skeg, rudder, propeller. */

/* Livery is painted per pixel in the shader, so stripes stay crisp at any zoom. */
function hullMaterial() {
  const P = SPEC.paint;
  const m = new T.MeshStandardMaterial({ color: 0xffffff, roughness: .3, envMapIntensity: .55, side: T.DoubleSide });
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, { uCream: { value: C(P.topsides) }, uNavy: { value: C(P.navy) }, uAnti: { value: C(P.antifoul) } });

      sh.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>

      c=mix(c,uNavy,smoothstep(${P.sheerBand[0]}-e,${P.sheerBand[0]}+e,vDown)*(1.-smoothstep(${P.sheerBand[1]}-e,${P.sheerBand[1]}+e,vDown)));

      for (let j = 0; j <= NV; j++) { const x = lerp(starts[j], L, u), p = sectionPt(x, j/NV); r.push([x, p[1], side*p[0]]); }

/* Deck: two strips from the trunk (or centreline) out to the rail. */

/* Toe rail, following the sheer and across the transom. */

/* Roof: teak forward of the windscreen, cream around the cockpit. */

/* Cockpit well: coaming walls, teak seats, footwell, sole, companionway bulkhead. */

/* Fixed windscreen on its moulded base with the navy stripe, framed in stainless. */
const SC = SPEC.screen;
function mirrored(line) { return [...line.slice(1).reverse().map(p => [p[0], -p[1]]), ...line]; }
(function windscreen() {

  // moulded base: a low cream plinth from the roof up to the glass line
  const plinth = base.map(([x, z]) => [[x + .08, roofY(Math.min(x + .08, 6.66), z*1.05) - .005, z*1.05], [x, SC.baseY - .035, z], [x - .02, SC.baseY, z*.985]]);

  const stripe = base.map(([x, z]) => [[x + .036, SC.baseY - .03 - .022, z*1.024], [x + .018, SC.baseY - .03 + .008, z*1.009]]);

/* The moulded TARGA arch that carries the mainsheet. */
const TG = SPEC.targa;

  const a = Math.abs(f), leg = .78, s = Math.sign(f) || 1;
  if (a > leg) { const q = (a - leg)/(1 - leg), e = 1 - (1 - q)*(1 - q)*.0;
    return [lerp(TG.topX - .05, TG.baseX, e), lerp(TG.topY - .12, roofY(TG.baseX, TG.baseHalf) - .01, e), s*lerp(TG.topHalf + .01, TG.baseHalf, e)]; }

/* Navy canvas, rig, guard rails, stern gear and bow gear. */

    if (d.layout === 'split') {

      if (count === 2) return mirror(f, slot);
      if (count === 3) return [strip(d.centreX, -W/2), ...mirror(f, W/2 + g)];     // the middle panel sits aft of the backstay
      return [...mirror(f, slot), ...mirror(f, slot + W + g)];
    }

  }

  const ground = new T.Mesh(new T.CircleGeometry(800, 48), new T.MeshStandardMaterial({ color: C('#a8adad'), roughness: .95 }));
  ground.rotation.x = -Math.PI/2; ground.position.y = -SPEC.hull.draft - SPEC.hull.floatSink - .35; ground.receiveShadow = true; ground.visible = false; scene.add(ground);

  /* Brochure drawing overlays, in true scale */

  const gx = g => (g - 122)/148.85, gy = g => (512 - g)/150;

  const prof = new T.Mesh(new T.PlaneGeometry(gx(1800) - gx(0), (807)/150), ovMat(OVERLAYS.profile));
  prof.position.set((gx(0) + gx(1800))/2, (gy(0) + gy(807))/2, 3); prof.renderOrder = 20; overlay.add(prof);
  const planK = .989/148.85, plan = new T.Mesh(new T.PlaneGeometry(gx(1800) - gx(0), 697*planK), ovMat(OVERLAYS.plan));
  plan.rotation.x = -Math.PI/2; plan.position.set((gx(0) + gx(1800))/2, 4, (348.5 - 305)*planK); plan.renderOrder = 20; overlay.add(plan);

  /* Cameras: perspective to look around, orthographic for true-scale elevations */
  const persp = new T.PerspectiveCamera(32, 1, .4, 2200), ortho = new T.OrthographicCamera(-1, 1, 1, -1, 1, 1400);
  const view = { th: .78, ph: 1.33, r: 21, tx: 0, ty: 2.7, tz: 0, ortho: false, span: 13 };
  const goal = { ...view };

    deck:   { th: .62, ph: .92, r: 15.5, tx: -.2, ty: .9, tz: 0, ortho: false },
    stern:  { th: Math.PI*1.5 + 2.0, ph: 1.33, r: 13.5, tx: -2.5, ty: 1.15, tz: 0, ortho: false },
